[project]
name = "physh-tank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# uv sync --all-extras      → full local dev environment (backend + frontend + dev)
# uv sync --extra backend       → lean backend-only install (for Docker/FastAPI image)
# uv sync --extra frontend      → lean frontend-only install (for Docker/Streamlit image)
[project.optional-dependencies]
backend = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic>=2.13.5",
    "torch>=2.12.1",
    "transformers>=5.12.1",
    "peft>=0.20.0",
    "pylatexenc>=2.11",
]
frontend = [
    "requests>=2.34.2",
    "streamlit>=1.64.0",
]
dev = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "gensim>=4.4.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "lxml>=6.1.1",
    "matplotlib>=3.11.0",
    "napkinxc>=0.7.2",
    "networkx>=3.6.1",
    "nltk>=3.9.4",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "python-dotenv>=1.2.3",
    "rdflib>=7.6.0",
    "scikit-learn>=1.9.0",
    "selenium>=4.45.0",
    "tqdm>=4.68.3",
    "xgboost>=3.4.0",
]

# Direct uv to fetch "torch" from PyTorch's CPU repository to avoid large CUDA bundled pytorch
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
